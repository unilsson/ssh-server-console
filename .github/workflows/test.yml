name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run parser tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python3 -m compileall -q src tests

      - name: Install GTK and headless display
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-vte-2.91 xvfb xauth

      - name: GUI and terminal lifecycle tests (system Python for PyGObject)
        run: xvfb-run -a env PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v
